name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Publish the existing v1.5.0 tag
        required: true
        type: choice
        options:
          - v1.5.0

# Serialize release runs so rapid tag pushes don't race on npm publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14

    # npm trusted publishing exchanges this job's OIDC identity for a
    # short-lived npm publish token; no long-lived npm secret is required.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify npm trusted publishing client
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          npm --version

      - name: Build TypeScript
        run: pnpm run build:ts

      - name: Prepare universal event binary from upstream release assets
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          mkdir -p bin "$work_dir/amd64" "$work_dir/arm64"

          curl --fail --location --silent --show-error \
            --output "$work_dir/event-darwin-amd64.tar.gz" \
            https://github.com/FradSer/event/releases/download/v0.8.0/event-darwin-amd64.tar.gz
          curl --fail --location --silent --show-error \
            --output "$work_dir/event-darwin-arm64.tar.gz" \
            https://github.com/FradSer/event/releases/download/v0.8.0/event-darwin-arm64.tar.gz
          echo "c8a38d001fe2789c25d638def0db35b7ab766e8eed849e53f791f394b92e86b3  $work_dir/event-darwin-amd64.tar.gz" | shasum -a 256 -c -
          echo "2b8a78368a7db21f75645d679e81acb8add2b48173da21d0fa1716c0122e2826  $work_dir/event-darwin-arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf "$work_dir/event-darwin-amd64.tar.gz" -C "$work_dir/amd64"
          tar -xzf "$work_dir/event-darwin-arm64.tar.gz" -C "$work_dir/arm64"

          amd64_binary="$(find "$work_dir/amd64" -type f -perm -111 -print -quit)"
          arm64_binary="$(find "$work_dir/arm64" -type f -perm -111 -print -quit)"
          test -n "$amd64_binary" && test -n "$arm64_binary"
          lipo -create "$amd64_binary" "$arm64_binary" -output bin/event
          chmod 755 bin/event

          # Keep the EventKit identity and permissions expected by the runtime.
          plutil -lint scripts/event-Info.plist
          event_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' scripts/event-Info.plist)"
          codesign --force --sign - --options runtime \
            --identifier "$event_identifier" \
            --entitlements scripts/event.entitlements \
            bin/event

      - name: Verify universal ad-hoc event binary
        run: |
          set -euo pipefail
          echo "=== Architecture ==="
          lipo -info bin/event | tee /tmp/lipo.out
          grep -q "are: x86_64 arm64\|are: arm64 x86_64" /tmp/lipo.out
          echo "=== Reminder date-window options ==="
          bin/event reminders list --help > /tmp/reminders-list-help.out 2>&1
          grep -q -- '--start' /tmp/reminders-list-help.out
          grep -q -- '--end' /tmp/reminders-list-help.out
          echo "=== Calendar by-id lookup and calendar listing ==="
          bin/event calendar get --help > /tmp/calendar-get-help.out 2>&1
          grep -q -- '--id' /tmp/calendar-get-help.out
          bin/event calendar calendars --help > /tmp/calendar-calendars-help.out 2>&1
          grep -q -- '--json' /tmp/calendar-calendars-help.out
          echo "=== Code signature ==="
          codesign -dv --verbose=2 bin/event 2>&1 | tee /tmp/codesign.out
          ! grep -q "Authority=" /tmp/codesign.out
          codesign --verify --strict --verbose=2 bin/event

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          PACK_JSON="$(npm pack --json --dry-run)"
          PACK_JSON="$PACK_JSON" node -e '
            const [pack] = JSON.parse(process.env.PACK_JSON);
            const files = new Set(pack.files.map((file) => file.path));
            const requiredFiles = [
              "bin/event",
              "dist/index.js",
              "scripts/postinstall.mjs",
              "scripts/build-event.mjs",
              "scripts/event-Info.plist",
              "scripts/event.entitlements",
            ];
            const missing = requiredFiles.filter((file) => !files.has(file));
            if (missing.length > 0) {
              console.error(`Missing package files: ${missing.join(", ")}`);
              process.exit(1);
            }
            const forbidden = [...files].filter(
              (path) => /\.test\.ts$/.test(path) || /\.spec\.ts$/.test(path),
            );
            if (forbidden.length > 0) {
              console.error(`Dead-weight files in tarball: ${forbidden.join(", ")}`);
              process.exit(1);
            }
          '

      - name: Run release tests
        # EventKit E2E calls require a user GUI and Reminders/Calendar
        # permissions, which are unavailable on GitHub-hosted runners.
        run: pnpm exec jest --runInBand --testPathIgnorePatterns=src/e2e.test.ts

      - name: Publish to npm
        run: npm publish --access public
