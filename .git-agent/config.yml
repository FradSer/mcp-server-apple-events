scopes:
    - name: bin
      description: launch entry points and vendored binaries in bin/; does not cover build scripts
    - name: scr
      description: build and post-install scripts in scripts/; does not cover source code or project metadata
    - name: srv
      description: MCP server transport, request handlers, and prompt abstractions in src/server/; does not cover tools
    - name: tools
      description: tool definitions, routing, and CRUD logic in src/tools/; does not cover core utility functions
    - name: utils
      description: shared logic like CLI executor, date/time, and error handling in src/utils/; does not cover business tools
    - name: swift
      description: Apple EventKit Swift source, entitlements, and metadata in src/swift/; does not cover build scripts
    - name: val
      description: zod validation schemas and constraints in src/validation/; does not cover business logic
    - name: types
      description: global typescript interfaces and shared domain types in src/types/
